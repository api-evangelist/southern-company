name: Southern Company
kind: company
description: >-
  Southern Company is an Atlanta-headquartered energy holding company and one of the largest
  producers of electricity in the United States, serving approximately 9 million electric and
  natural gas customers through Alabama Power, Georgia Power, Mississippi Power, Southern Power,
  Southern Company Gas (Atlanta Gas Light, Nicor Gas, Virginia Natural Gas, Chattanooga Gas),
  Southern Nuclear, PowerSecure, Southern Linc and Southern Telecom. It sits at the
  vertically-integrated regulated-utility layer of the value chain — it owns generation,
  transmission and distribution, operates its own balancing authority rather than belonging to an
  ISO/RTO, and runs a FERC-approved bid-based energy auction for wholesale power in the Southeast.
  Its API posture is honestly closed on both sides of the sector's two-speed split. There is no
  consumer data mandate in Alabama, Georgia or Mississippi and Southern Company does not implement
  Green Button Download My Data or Connect My Data, is not listed by the Green Button Alliance, and
  publishes no ESPI endpoint — a customer can only export their own interval data as a spreadsheet
  after logging into My Power Usage, and a third party gets billing history only through a signed
  paper release form. On the market side the FERC-required auction clearing prices and
  weighted-average hour-ahead transaction prices are posted as public web pages, but they are
  JavaScript-rendered HTML with no CSV, no feed and no API behind them. A production Apigee API
  gateway is live at api.southernco.com and developer.southernco.com resolves behind an Imperva
  edge, so the platform machinery exists internally, but no proxy, no specification and no
  documentation are published to anyone outside the company.
