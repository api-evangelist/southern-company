aid: southern-company
name: Southern Company
review:
  question: >-
    Does Southern Company expose a documented public API — for consumer energy data, for market
    data, or for anything else — and does any consumer-data mandate apply to it?
  answer: false
  date: '2026-07-27'
  reviewer: API Evangelist
  homeMarket: United States
  tier: utility-retailer
  primaryDomain: southerncompany.com

energyDataPosture:
  mandateRegime: none
  mandateRegimeVerbatim: >-
    No consumer energy-data mandate applies to Southern Company. Its regulated electric utilities
    operate in Alabama, Georgia and Mississippi; its gas utilities in Georgia, Tennessee, Illinois
    and Virginia. None of those states has adopted a Green Button mandate of the Ontario kind, and
    the United States has no federal energy analogue to the Australian Consumer Data Right. Green
    Button (NAESB/NIST ESPI) exists as a real standard in this market but nothing compels a US
    utility to adopt it, and Southern Company has not.
  mandateStatus: none
  mandateStatusEvidence: >-
    Recorded as `none` rather than `green-button-voluntary` because no voluntary adoption was found
    either. Southern Company, Georgia Power, Alabama Power and Mississippi Power are not named on
    the Green Button Alliance certification page (https://www.greenbuttonalliance.org/testing,
    HTTP 200 after redirect from /certification; the only organizations named there are the
    sponsor members Con Edison, Enbridge Gas and UtilityAPI). No Download My Data or Connect My
    Data affordance appears on any Southern Company property probed. No ESPI/Green Button endpoint,
    authorization server, or `.well-known` document was found on any Southern Company host. This is
    an absence verified by probing, not a claim repeated from the company.

  dataStandard: no standard reference found
  dataStandardNote: >-
    No Green Button/ESPI, no CDR Consumer Data Standards, no IEEE 2030.5, no OpenADR, no OCPP/OCPI,
    no IEC CIM 61968/61970 reference was found on any public Southern Company surface. A single
    case-insensitive substring hit for "espi" inside the My Power Usage HTML shell could not be
    resolved to any ESPI reference on inspection and is not treated as evidence.

  consumerVsMarketSplit:
    consumerDataApi: false
    consumerDataDetail: >-
      A third party cannot obtain an individual customer's usage or billing data through any
      documented API. The three real paths are all non-API: (1) the customer logs in to My Power
      Usage at customerservice2.southerncompany.com/Billing/MyPowerUsage (HTTP 200, an
      8,571-byte JavaScript login shell — the data itself is behind authentication) and exports
      their own interval data to a spreadsheet; (2) commercial and industrial customers use the
      EnergyDirect portal for interval usage with Excel/CSV/PDF export; (3) a third party receives
      up to twelve months of billing history only after the customer signs a paper "Release of
      Billing History to Third Party" authorization. There is no consent API, no accreditation
      scheme, and no machine-readable consumer data surface of any kind.
    marketDataOpen: false
    marketDataDetail: >-
      Southern Company is its own balancing authority in SERC and does not belong to an ISO/RTO, so
      there is no ISO market feed to publish. It does post FERC-required wholesale market
      information anonymously as web pages — Auction Clearing Prices
      (/about/energy-auction/auction-clearing-prices.html, HTTP 200) and Weighted Average
      Hour-Ahead Transaction Prices
      (/about/our-business/weighted-average-hour-ahead-transaction-prices.html, HTTP 200) — but
      both are Adobe AEM pages whose 45KB payloads contain only navigation chrome. Grepping each
      payload for href values ending in .xls/.xlsx/.csv/.pdf/.zip/.xml/.json returned zero matches,
      and grepping for api/.json/servlet/graphql/bin paths returned only a Google Fonts URL. Public
      posting exists; open machine-readable market data does not. This is the finding: the
      disclosure obligation was met with HTML, not with data.
    oasisNote: >-
      Southern Company maintains a FERC Order 889 OASIS node at www.oasis.oati.com/SOCO (referenced
      in its own tariff documents). It could NOT be verified from this environment: DNS resolves to
      216.234.82.8 and 174.141.249.8, but the TLS handshake stalls and curl returns HTTP 000 on
      /SOCO/index.html and on the SOCOdocs PDF paths; a fetch through the rendering proxy failed
      with "unable to get local issuer certificate". Recorded as unverified, not as open data.

  accessGate: customer-account-required
  accessGateDetail: >-
    What a developer must actually do to get in: nothing works. There is no signup, no application
    form, no key issuance, no sandbox, and no partner program published for API access. The only
    route to any Southern Company data is to be the account holder and log in to the customer
    portal, or to hold a signed customer authorization and receive billing history out of band. A
    would-be integrator has no self-serve or reviewed path.
  authModel: >-
    No public authentication scheme is documented. /.well-known/openid-configuration returned
    HTTP 404 on both www.southerncompany.com and customerservice2.southerncompany.com — nothing is
    served anonymously. The customer portal uses a session/JWT flow issued by
    webauth.southernco.com, but it is an internal web-application login, not a published developer
    auth model, and no OAuth 2.0 authorization server, scope catalog, mTLS profile or accreditation
    scheme is exposed.

apiGatewayFinding:
  summary: >-
    Southern Company runs a production Apigee Edge API gateway. It is live and answering, but no
    proxy is reachable and nothing is documented — the platform exists inside the company and stops
    at the edge.
  host: api.southernco.com
  evidence: >-
    Every probed path returns HTTP 404 with the Apigee fault body
    {"fault":{"faultstring":"Unable to identify proxy for host: PrProdVHost and url: ...",
    "detail":{"errorcode":"messaging.adaptors.http.flow.ApplicationNotFound"}}} — a live Apigee
    router with no matching API proxy, fronted by Imperva (x-cdn: Imperva) and instrumented with
    Dynatrace (dtCookie). Paths probed: / , /openapi.json , /swagger.json , /v1 , /apis , /status ,
    /health , /.well-known/openid-configuration , /oauth/token — all HTTP 404, all the same fault.
  developerPortalHost: developer.southernco.com
  developerPortalEvidence: >-
    Resolves and is served by Imperva, but returns HTTP 503 with retry-after: 5 and an 883-byte
    _Incapsula_Resource bot-challenge body, both with a plain user agent and with a full browser
    header set (Accept, Accept-Language, Sec-Fetch-*). NOT confirmed to be a real developer portal —
    it may be an Apigee developer portal behind a bot wall, or a placeholder. No content was ever
    served, so it is not recorded as a developer portal in apis.yml.

