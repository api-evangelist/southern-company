unofficialSurfaces:
  summary: >-
    The only programmatic access to Southern Company customer data that exists in the wild is
    unofficial and reverse-engineered. It is recorded here for accuracy and is deliberately absent
    from apis.yml, because an undocumented internal endpoint scraped out of a login flow is not a
    published API.
  library: https://github.com/apearson/southern-company-api
  libraryNote: >-
    A Node.js library that logs in as the customer by scraping a RequestVerificationToken from the
    login page, POSTing to webauth.southernco.com/api/login, then exchanging for a JWT at
    customerservice2.southerncompany.com/Account/LoginValidated/JwtToken (and cookie auth against
    customerportal.southerncompany.com for Nicor Gas). It carries no official support and no terms
    grant. It is evidence that Southern Company has internal APIs; it is not evidence of a public
    one.
  eixClaim: >-
    A third-party vendor page (nectarclimate.com/utilities/georgia-power-co) states that a "Southern
    Company Energy Information eXchange (EIX)" is "being developed as an API-based data sharing
    platform for approved customers and partners". NO Southern Company source for EIX was found on
    any probed property, and no EIX host, documentation or endpoint could be located. Recorded as an
    UNVERIFIED secondary claim. A vendor page is not an implementation.

findings:
  developerPortal: none confirmed
  openAPIsHarvested: 0
  specsHarvested: 0
  gated: true
  conclusion: >-
    Southern Company is a clean example of the sector's central lesson read from the other
    direction. Where Australia has a mandate and a partial implementation, Southern Company has
    neither — no obligation exists, so nothing was built, and the result is a nine-million-customer
    utility with a production API gateway serving nobody. Both halves of the two-speed split are
    closed: consumer data reaches third parties only via a signed paper form, and the market data
    the regulator requires it to publish is published as HTML that contains no data. The one
    genuinely interesting artifact is api.southernco.com — proof that the platform capability is
    already in place and that the missing ingredient is a reason to open it.

